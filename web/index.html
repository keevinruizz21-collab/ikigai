<style>
/* Layout: app shell — sticky top bar; left rail on desktop, bottom tab bar on phone; content is a grid of panels, the quincena readout leads */
:root{
  --bg:#f1f4f3; --panel:#fcfdfc; --panel-2:#e9eeec; --ink:#10201c; --ink-2:#46544f; --muted:#76837e;
  --line:#dde4e1; --line-2:#c6d0cc; --focus:#0d5c6b;
  --accent:#0d5c6b; --accent-ink:#ffffff; --accent-soft:#d9eaed; --accent-2:#0a4a57;
  --hero:#0f2e33; --hero-2:#16404a; --hero-ink:#eaf4f3; --hero-mute:#9fbcbd; --hero-line:rgba(234,244,243,.16);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300; --warn-ink:#8a5a00; --crit-ink:#b02e2e;
  --good-soft:#e2f3e2; --warn-soft:#fdf0d2; --crit-soft:#f9e0e0; --info-soft:#e3edf9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --bar-mute:#c9d3cf; --grid:#e3e8e6; --axis:#c3cbc8;
  --h1:#e3eefb; --h2:#b7d3f6; --h3:#86b6ef; --h4:#3987e5; --h5:#256abf; --h6:#104281;
  --h-ink-lo:#10201c; --h-ink-hi:#ffffff;
  --shadow:0 1px 2px rgba(16,32,28,.06), 0 6px 18px rgba(16,32,28,.06);
  --font-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1312; --panel:#151c1b; --panel-2:#1c2523; --ink:#ecf2f0; --ink-2:#b4c0bc; --muted:#83908c;
    --line:#25302e; --line-2:#344240; --focus:#62bccb;
    --accent:#5fb8c8; --accent-ink:#06191d; --accent-soft:#16343b; --accent-2:#86cbd7;
    --hero:#0f2a2f; --hero-2:#173a42; --hero-ink:#eaf4f3; --hero-mute:#93b3b4; --hero-line:rgba(234,244,243,.14);
    --good-ink:#3fc23f; --warn-ink:#f2c55c; --crit-ink:#ef7c7c;
    --good-soft:#163019; --warn-soft:#352a10; --crit-soft:#3a1c1c; --info-soft:#17283d;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --bar-mute:#3a4744; --grid:#222c2a; --axis:#384542;
    --h1:#172c45; --h2:#1c4f8a; --h3:#2a78d6; --h4:#3987e5; --h5:#6da7ec; --h6:#b7d3f6;
    --h-ink-lo:#ecf2f0; --h-ink-hi:#06121f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1312; --panel:#151c1b; --panel-2:#1c2523; --ink:#ecf2f0; --ink-2:#b4c0bc; --muted:#83908c;
  --line:#25302e; --line-2:#344240; --focus:#62bccb;
  --accent:#5fb8c8; --accent-ink:#06191d; --accent-soft:#16343b; --accent-2:#86cbd7;
  --hero:#0f2a2f; --hero-2:#173a42; --hero-ink:#eaf4f3; --hero-mute:#93b3b4; --hero-line:rgba(234,244,243,.14);
  --good-ink:#3fc23f; --warn-ink:#f2c55c; --crit-ink:#ef7c7c;
  --good-soft:#163019; --warn-soft:#352a10; --crit-soft:#3a1c1c; --info-soft:#17283d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --bar-mute:#3a4744; --grid:#222c2a; --axis:#384542;
  --h1:#172c45; --h2:#1c4f8a; --h3:#2a78d6; --h4:#3987e5; --h5:#6da7ec; --h6:#b7d3f6;
  --h-ink-lo:#ecf2f0; --h-ink-hi:#06121f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.05rem}
h3{font-size:.95rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.small{font-size:.85rem}
.xs{font-size:.76rem}
.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic.sm svg{width:16px;height:16px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.col{min-width:0}
@media (max-width:460px){ .top-in:has(#monthSw:not([hidden])) .brand-name{display:none} .sync span{display:none} .month .lbl{min-width:104px} }
.rail{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{min-width:28px;height:28px;padding:0 7px;border-radius:7px;background:var(--hero);color:var(--hero-ink);display:grid;place-items:center;font-family:var(--font-mono);font-weight:500;font-size:.78rem;letter-spacing:-.02em;flex:none}
.brand-name{font-weight:600;font-size:1.02rem;letter-spacing:-.01em}
.top .spacer{flex:1}
.month{display:flex;align-items:center;gap:2px;background:var(--panel-2);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
.month button:hover:not(:disabled){background:var(--panel)}
.month button:disabled{opacity:.35;cursor:default}
.month .lbl{min-width:118px;text-align:center;font-weight:500;font-size:.88rem;text-transform:capitalize;white-space:nowrap}
.sync{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block}
.sync[data-s="ok"] i{background:var(--good)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="off"] i{background:var(--crit)}
.sync[data-s="demo"] i{background:var(--s5)}
.iconbtn{border:1px solid var(--line);background:var(--panel);width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{border-color:var(--line-2);color:var(--ink)}

main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:16px;max-width:1240px;margin:0 auto}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.view-head h1{font-size:1.4rem}
.view-head p{color:var(--ink-2);font-size:.9rem}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:500}
.tabbar a[aria-current="page"]{color:var(--accent)}
.tabbar a.add span.ic{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.tabbar a.add span.ic svg{width:24px;height:24px;stroke-width:2.2}
.tabbar a.add{color:var(--ink-2)}

@media (min-width:980px){
  .app{grid-template-columns:228px minmax(0,1fr)}
  .app{background:linear-gradient(90deg,var(--panel) 0 227px,var(--line) 227px 228px,transparent 228px)}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:var(--panel)}
  .rail .brand{padding:4px 8px 18px}
  .rail a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:.92rem}
  .rail a:hover{background:var(--panel-2);color:var(--ink)}
  .rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-2)}
  .rail .rail-add{margin-top:6px;background:var(--accent);color:var(--accent-ink)!important;justify-content:center}
  .rail .rail-add:hover{background:var(--accent-2)!important}
  .rail .rail-foot{margin-top:auto;font-size:.76rem;color:var(--muted);padding:8px 10px;line-height:1.4}
  .tabbar{display:none}
  .top .brand{display:none}
  main{padding-block:22px 48px}
}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h .sub{font-size:.82rem;color:var(--muted)}
.grid{display:grid;gap:16px;min-width:0}
.g2{grid-template-columns:minmax(0,1fr)}
.g3{grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){ .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:1180px){ .g3{grid-template-columns:repeat(3,minmax(0,1fr))} }
.span2{grid-column:1/-1}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:18px;color:var(--ink-2);font-size:.9rem;display:grid;gap:10px;justify-items:start}
.note{font-size:.82rem;color:var(--ink-2);background:var(--panel-2);border-radius:var(--r-sm);padding:10px 12px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--info-soft);color:var(--ink);font-size:.88rem}
.banner.warn{background:var(--warn-soft)}
.banner.crit{background:var(--crit-soft)}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:500;font-size:.9rem;min-height:40px;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--crit-ink);border-color:var(--crit-soft)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.82rem}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.lg{min-height:50px;font-size:1rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.stack.s8{gap:8px}
.stack.s16{gap:16px}
label.f{display:grid;gap:6px;font-size:.82rem;color:var(--ink-2);font-weight:500;min-width:0}
.in, select.in, textarea.in{width:100%;min-width:0;border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);padding:9px 11px;font-size:.95rem;min-height:40px;color:var(--ink)}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.in:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.in.money{font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:.86rem;line-height:1.2;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip .tag{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.04em;opacity:.75}
.seg{display:inline-flex;background:var(--panel-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:500;font-size:.88rem;color:var(--ink-2);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:600;line-height:1.5;white-space:nowrap}
.pill .ic svg{width:13px;height:13px;stroke-width:2.2}
.pill.good{background:var(--good-soft);color:var(--good-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.crit{background:var(--crit-soft);color:var(--crit-ink)}
.pill.info{background:var(--info-soft);color:var(--ink-2)}
.pill.neutral{background:var(--panel-2);color:var(--ink-2)}

/* ---------- hero: quincena readout ---------- */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:18px;display:grid;gap:16px;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--hero-mute)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hero-fig{font-size:clamp(2.4rem,9vw,3.6rem);font-weight:600;letter-spacing:-.03em;line-height:1.02;margin-top:6px}
.hero-fig.neg{color:#ffb4a6}
.hero-sub{color:var(--hero-mute);font-size:.95rem;margin-top:6px}
.hero-sub b{color:var(--hero-ink);font-weight:600}
.hero .pill{background:var(--hero-2);color:var(--hero-ink)}
.hero .pill.good{background:#1d4d2a;color:#c6f2c6}
.hero .pill.warn{background:#4d3d12;color:#ffe2a1}
.hero .pill.crit{background:#5a2222;color:#ffc2c2}
.pace{display:grid;gap:8px}
.pace-row{display:grid;grid-template-columns:86px minmax(0,1fr) 54px;align-items:center;gap:10px;font-size:.8rem;color:var(--hero-mute)}
.pace-row .v{text-align:right;color:var(--hero-ink);font-variant-numeric:tabular-nums}
.pace-track{height:8px;border-radius:999px;background:var(--hero-line);overflow:hidden}
.pace-fill{height:100%;border-radius:999px;background:var(--hero-ink)}
.pace-fill.time{background:var(--hero-mute)}
.pace-fill.warn{background:var(--warn)}
.pace-fill.crit{background:#ff8a7a}
.hero-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:860px){ .hero{padding:22px 24px} .hero-cols{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px} }
.fx-list{display:grid;gap:6px}
.fx{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--hero-2);font-size:.86rem}
.fx .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .m{font-variant-numeric:tabular-nums;color:var(--hero-mute)}
.fx.paid .n{color:var(--hero-mute);text-decoration:line-through;text-decoration-color:var(--hero-line)}
.fx.rc{grid-template-columns:minmax(0,1fr) auto}
.fx button{border:1px solid var(--hero-line);background:transparent;color:var(--hero-ink);border-radius:6px;padding:4px 9px;font-size:.78rem;font-weight:500}
.fx button:hover{background:var(--hero)}
.fx .ok{color:#9be09b;font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:4px}
.hero details{font-size:.85rem;color:var(--hero-mute)}
.hero summary{cursor:pointer;color:var(--hero-ink);font-weight:500;list-style:none;display:inline-flex;align-items:center;gap:6px}
.hero summary::-webkit-details-marker{display:none}
.hero summary::after{content:"+";font-family:var(--font-mono)}
.hero details[open] summary::after{content:"−"}
.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;margin-top:10px;font-variant-numeric:tabular-nums}
.calc .t{border-top:1px solid var(--hero-line);padding-top:6px;margin-top:4px;color:var(--hero-ink);font-weight:600}
.calc span:nth-child(even){text-align:right}
.hero .btn{background:var(--hero-2);border-color:var(--hero-line);color:var(--hero-ink)}
.hero .btn:hover{border-color:var(--hero-mute)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){ .tiles{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:1180px){ .tiles{grid-template-columns:repeat(6,minmax(0,1fr))} .tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))} }
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;min-width:0;align-content:start}
.tile .l{font-size:.78rem;color:var(--ink-2);font-weight:500}
.tile .v{font-size:1.32rem;font-weight:600;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.tile .d{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:18px}
.tile .d .up-good,.tile .d .down-good{color:var(--good-ink);font-weight:600}
.tile .d .up-bad,.tile .d .down-bad{color:var(--crit-ink);font-weight:600}
.tile svg.spark{width:100%;height:26px;display:block;margin-top:2px}

/* ---------- bolsillos meters ---------- */
.meters{display:grid;gap:14px}
.meter{display:grid;gap:6px}
.meter-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:.88rem}
.meter-h .n{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.meter-h .n span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter-h .v{font-size:.8rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter-track{height:8px;border-radius:999px;background:var(--accent-soft);overflow:hidden;position:relative}
.meter-fill{height:100%;border-radius:999px;background:var(--accent)}
.meter-fill.warn{background:var(--warn)}
.meter-fill.crit{background:var(--crit)}
.meter-foot{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}

/* ---------- segmented bar ---------- */
.segbar{display:flex;gap:2px;height:28px;width:100%;margin-top:4px}
.segbar > div{height:100%;border-radius:4px;display:flex;align-items:center;padding:0 7px;min-width:0;overflow:hidden;font-size:.74rem;font-weight:600;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.segbar > div.dark{color:#0b0b0b}
.segbar > div span.hide{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.78rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .key{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend .lkey{width:14px;height:2px;border-radius:2px;display:inline-block}
.legend .lkey.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important;height:2px}

/* ---------- recommendations ---------- */
.recs{display:grid;gap:10px}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--panel-2)}
.rec .pill{grid-row:1/span 2;margin-top:1px}
.rec .t{font-weight:600;font-size:.9rem}
.rec .d{font-size:.84rem;color:var(--ink-2)}

/* ---------- lists ---------- */
.mlist{display:grid}
.mday{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px;font-size:.78rem;color:var(--muted);border-bottom:1px solid var(--line);font-family:var(--font-mono);letter-spacing:.02em}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}
.mrow:hover{background:var(--panel-2)}
.mrow .badge{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--font-mono);font-size:.7rem;font-weight:500;color:var(--ink-2);background:var(--panel-2);position:relative;flex:none}
.mrow .badge i{position:absolute;left:3px;top:3px;width:7px;height:7px;border-radius:50%}
.mrow .main{min-width:0;display:block}
.mrow .main .c,.mrow .main .s{display:block}
.mrow .main .c{font-weight:500;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .main .s{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem;text-align:right;white-space:nowrap}
.mrow .amt.in{color:var(--good-ink)}
.mrow .amt.sv{color:var(--accent)}

/* ---------- tables ---------- */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:.74rem;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r, table.t th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}

/* ---------- charts ---------- */
.chart{width:100%;min-height:60px;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart svg text{font-family:var(--font-ui);font-size:11px;fill:var(--muted)}
.chart svg .lbl-strong{fill:var(--ink);font-weight:600}
.chart .gl{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.chart .ax{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.dash{stroke-dasharray:5 5}
.chart .area{opacity:.1}
.chart .xh{stroke:var(--ink-2);stroke-width:1;opacity:.55}
.chart .hov{fill:transparent;touch-action:pan-y;cursor:crosshair}
.chart .ring{stroke:var(--panel);stroke-width:2}
.chart .bar{cursor:default}
.chart .bar:hover,.chart .bar:focus{opacity:.82;outline:none}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(84px,32%) minmax(0,1fr) 86px;gap:10px;align-items:center;font-size:.84rem;border-radius:6px}
.hb:hover,.hb:focus{background:var(--panel-2);outline:none}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hb .tr{position:relative;height:14px}
.hb .b{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.hb .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px;opacity:.7}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.hb .v small{display:block;font-weight:400;color:var(--muted);font-size:.7rem}
.heat{border-collapse:separate;border-spacing:3px;font-size:.78rem}
.heat th{font-weight:500;color:var(--muted);font-size:.72rem;padding:2px 4px;white-space:nowrap;text-transform:capitalize}
.heat th.c{text-align:left;color:var(--ink-2);font-size:.8rem;text-transform:none;position:sticky;left:0;background:var(--panel);padding-right:8px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.heat td{width:46px;min-width:46px;height:28px;border-radius:4px;background:var(--panel-2)}
.heat td.z{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.heat td:hover,.heat td:focus{outline:2px solid var(--ink);outline-offset:-1px}
.heat td.h1{background:var(--h1)} .heat td.h2{background:var(--h2)} .heat td.h3{background:var(--h3)}
.heat td.h4{background:var(--h4)} .heat td.h5{background:var(--h5)} .heat td.h6{background:var(--h6)}
.scale{display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted);margin-top:8px}
.scale i{width:18px;height:10px;border-radius:2px;display:block}
.ctools{display:flex;gap:6px;align-items:center}
.linkbtn{border:0;background:none;color:var(--accent);font-size:.8rem;font-weight:500;padding:4px 2px}
.linkbtn:hover{text-decoration:underline}

#tip{position:fixed;z-index:60;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;font-size:.8rem;min-width:120px;max-width:260px}
#tip .tt{font-size:.74rem;color:var(--muted);margin-bottom:4px;text-transform:capitalize}
#tip .tr{display:grid;grid-template-columns:14px auto minmax(0,1fr);gap:6px;align-items:center;line-height:1.5}
#tip .tr b{font-variant-numeric:tabular-nums;font-weight:600}
#tip .tr span:last-child{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tip .k{width:14px;height:2px;border-radius:2px;display:block}

/* ---------- registrar ---------- */
.reg{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){ .reg{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start} }
.amount{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--line-2);padding:4px 0}
.amount:focus-within{border-color:var(--accent)}
.amount span{font-size:1.9rem;font-weight:500;color:var(--muted)}
.amount input{border:0;background:transparent;outline:none;font-size:2.4rem;font-weight:600;letter-spacing:-.02em;width:100%;min-width:0;padding:0;font-variant-numeric:tabular-nums}
.amount .k3{border:1px solid var(--line-2);background:var(--panel-2);border-radius:8px;padding:6px 10px;font-family:var(--font-mono);font-size:.85rem;flex:none}
.fgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:620px){ .fgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))} }
.catgroups{display:grid;gap:12px}
.catgroup h4{margin:0 0 6px;font-size:.74rem;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px;font-family:var(--font-mono);letter-spacing:.04em;text-transform:uppercase}
.parsed{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.prow > :nth-child(3){grid-column:1/-1}
.prow > :nth-child(5){grid-column:2/-1}
.prow > :nth-child(6){grid-column:3;grid-row:1}
.prow.doubt{border-color:var(--warn)}
@media (min-width:720px){ .prow{grid-template-columns:132px 96px minmax(0,1.4fr) 130px minmax(0,1fr) 34px;align-items:center} .prow > *{grid-column:auto!important;grid-row:auto!important} }
.prow .in{min-height:36px;padding:6px 8px;font-size:.86rem}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px}
.trow > :nth-child(3),.trow > :nth-child(6){grid-column:1/-1}
.trow > :nth-child(5){grid-column:2/-1}
.trow > :nth-child(7){grid-column:3;grid-row:1}
@media (min-width:860px){ .trow{grid-template-columns:132px 100px minmax(0,1.3fr) 120px minmax(0,1fr) minmax(0,1.2fr) 34px;border:0;padding:0;border-radius:0} .trow > *{grid-column:auto!important;grid-row:auto!important} }
.trow .in{min-height:36px;padding:6px 8px;font-size:.86rem}
.thead{display:none}
@media (min-width:860px){ .thead{display:grid;grid-template-columns:132px 100px minmax(0,1.3fr) 120px minmax(0,1fr) minmax(0,1.2fr) 34px;gap:8px;font-size:.74rem;color:var(--muted);padding:0 2px} }
.mic{display:inline-flex;align-items:center;gap:8px}
.mic[data-on="1"]{background:var(--crit-soft);border-color:var(--crit);color:var(--crit-ink)}
.partial{font-size:.82rem;color:var(--muted);font-style:italic;min-height:1.2em}

/* ---------- metas / deudas ---------- */
.goal{display:grid;gap:10px}
.goal-fig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.goal-fig b{font-size:1.5rem;letter-spacing:-.02em;font-weight:600}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:.85rem}
.kv span:nth-child(odd){color:var(--ink-2)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:500}

/* ---------- ajustes ---------- */
.sl{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:10px;align-items:center}
.sl .nm{display:flex;align-items:center;gap:8px;min-width:0}
.sl .nm input{flex:1}
.sl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.sl .pin{display:flex;align-items:center;gap:4px}
.sl .pin input{text-align:right}
.total{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;background:var(--panel-2);font-weight:600}
.total.bad{background:var(--crit-soft);color:var(--crit-ink)}
.total.ok{background:var(--good-soft);color:var(--good-ink)}
.ed{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.edrow{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px}
.edrow > .full{grid-column:1/-1}
@media (min-width:900px){
  .edrow.fx6{grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) 120px 92px 112px 112px 34px}
  .edrow.rc5{grid-template-columns:minmax(0,1.4fr) minmax(0,1.4fr) 140px 90px 34px}
  .edrow.ct5{grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) 120px 110px 34px}
  .edrow.mt6{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 130px 130px 130px 34px}
  .edrow.dd7{grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) 120px 130px 90px 120px 34px}
  .edrow > .full{grid-column:auto}
}
.edrow .in{min-height:36px;padding:6px 8px;font-size:.86rem}
.edrow .xbtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.edrow .xbtn:hover{color:var(--crit-ink);border-color:var(--crit)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--ink-2)}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
details.sec > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary .sub{font-weight:400;font-size:.82rem;color:var(--muted)}
details.sec > summary::after{content:"+";font-family:var(--font-mono);color:var(--muted);font-weight:400}
details.sec[open] > summary::after{content:"−"}
details.sec > .body{padding:0 16px 16px;display:grid;gap:12px}

/* ---------- ai ---------- */
.ai-score{display:flex;align-items:center;gap:14px}
.ai-score .sc{font-size:2.4rem;font-weight:600;letter-spacing:-.03em;line-height:1}
.ai-score .sc small{font-size:.9rem;color:var(--muted);font-weight:500}
.ai-out{white-space:pre-wrap;font-size:.9rem;line-height:1.55;color:var(--ink)}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:.88rem}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- sheet / toast ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(8,16,14,.45);display:flex;align-items:flex-end;justify-content:center;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (min-width:760px){ .sheet-wrap{align-items:center;padding:24px} }
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;box-shadow:var(--shadow)}
@media (min-width:760px){ .sheet{border-radius:14px} }
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:.88rem;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
#toast button{border:0;background:transparent;color:var(--bg);font-weight:600;text-decoration:underline;padding:2px}
@media (min-width:980px){ #toast{bottom:24px} }
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--crit-soft);font-size:.86rem}

.loading{display:grid;place-items:center;min-height:50vh;color:var(--ink-2);gap:10px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
