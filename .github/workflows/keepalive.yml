name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 14 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Latido (no lee ni escribe datos)
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" web/ikigai/config.js | head -1)
          KEY=$(grep -oE "sb_publishable_[A-Za-z0-9_-]+" web/ikigai/config.js | head -1)
          curl -fsS -X POST "$URL/rest/v1/rpc/ikigai_ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
