name: Compilar Windows y Android
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Compilar instalador (.exe)
        shell: bash
        run: |
          set -o pipefail
          { npm ci && npx tauri icon assets/icon-only.png && npx tauri build; } 2>&1 | tee build.log
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*.exe "dist/Ikigai-${GITHUB_REF_NAME}-windows-instalador.exe"
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Ikigai ${{ github.ref_name }}
          body_path: .github/release-notes.md
      - name: Guardar log
        if: always()
        shell: bash
        run: bash tools/ci-log.sh windows "${{ job.status }}"
  android:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Compilar APK
        env: { IKIGAI_ANDROID_KEY: '${{ secrets.IKIGAI_ANDROID_KEY }}' }
        run: |
          set -o pipefail
          bash tools/build-android.sh 2>&1 | tee build.log
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: Ikigai ${{ github.ref_name }}
          body_path: .github/release-notes.md
      - name: Guardar log
        if: always()
        run: bash tools/ci-log.sh android "${{ job.status }}"
