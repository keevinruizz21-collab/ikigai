name: Compilar Windows y Android
# Se ejecuta al subir cambios a la rama "release". La versión sale de package.json.
on:
  push:
    branches: [release]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Compilar instalador (.exe)
        shell: bash
        run: |
          set -o pipefail
          VERSION="v$(node -p "require('./package.json').version")"
          { npm ci && npx tauri icon assets/icon-only.png && npx tauri build; } 2>&1 | tee build.log
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*.exe "dist/Ikigai-$VERSION-windows-instalador.exe"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }
      - name: Guardar log
        if: always()
        shell: bash
        run: bash tools/ci-log.sh windows "${{ job.status }}"
  android:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Compilar APK
        env: { IKIGAI_ANDROID_KEY: '${{ secrets.IKIGAI_ANDROID_KEY }}' }
        run: |
          set -o pipefail
          bash tools/build-android.sh 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/*.apk }
      - name: Guardar log
        if: always()
        run: bash tools/ci-log.sh android "${{ job.status }}"
  publicar:
    needs: [windows, android]
    if: ${{ !cancelled() && (needs.windows.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Versión
        run: echo "VERSION=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Ikigai ${{ env.VERSION }}
          body_path: .github/release-notes.md
          files: dist/*
          make_latest: true
      - name: Guardar estado
        if: always()
        run: echo "release ${{ env.VERSION }} publicada" > build.log && bash tools/ci-log.sh publicar "${{ job.status }}"
